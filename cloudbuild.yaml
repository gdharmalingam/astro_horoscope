substitutions:
  _REGION: us-central1
  _SERVICE_NAME: vedic-horoscope-api
  _MIGRATION_JOB_NAME: vedic-horoscope-migrate
  _REPOSITORY: horoscope
  _RUNTIME_SERVICE_ACCOUNT: vedic-horoscope-runtime@PROJECT_ID.iam.gserviceaccount.com
  _SUPABASE_URL: https://eyhzawffavhmdsxzphek.supabase.co
  _CORS_ORIGINS: https://REPLACE_WITH_APP_HOSTING_DOMAIN

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vedic-horoscope-api:$COMMIT_SHA
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vedic-horoscope-api:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATION_JOB_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vedic-horoscope-api:$COMMIT_SHA
      - --region=${_REGION}
      - --command=alembic
      - --args=upgrade,head
      - --set-env-vars=ENVIRONMENT=production,EPHEMERIS_PATH=/app/ephe,SUPABASE_URL=${_SUPABASE_URL},SUPABASE_JWT_AUDIENCE=authenticated
      - --set-secrets=DATABASE_URL=horoscope-database-url:latest
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --execute-now
      - --wait

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vedic-horoscope-api:$COMMIT_SHA
      - --region=${_REGION}
      - --allow-unauthenticated
      - --port=8000
      - --set-env-vars=ENVIRONMENT=production,EPHEMERIS_PATH=/app/ephe,SUPABASE_URL=${_SUPABASE_URL},SUPABASE_JWT_AUDIENCE=authenticated,CORS_ORIGINS=${_CORS_ORIGINS}
      - --set-secrets=DATABASE_URL=horoscope-database-url:latest
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vedic-horoscope-api:$COMMIT_SHA
